<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#grad-bg)" stroke="#334155" stroke-width="6"/>

  <!-- Trolley Basket -->
  <g filter="url(#glow)">
    <path d="M120 130 H160 L195 300 H380 L420 170 H180" fill="none" stroke="url(#grad-accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Trolley Wheels -->
    <circle cx="215" cy="360" r="28" fill="#10b981" />
    <circle cx="215" cy="360" r="10" fill="#0f172a" />
    <circle cx="360" cy="360" r="28" fill="#10b981" />
    <circle cx="360" cy="360" r="10" fill="#0f172a" />
    <!-- Basket Grid lines -->
    <line x1="220" y1="210" x2="385" y2="210" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
    <line x1="235" y1="255" x2="365" y2="255" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
    <line x1="260" y1="180" x2="275" y2="295" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
    <line x1="320" y1="180" x2="330" y2="295" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Safety Budget Shield Badge at top right -->
  <g transform="translate(310, 80)">
    <path d="M70 10 L130 35 V85 C130 130 70 165 70 165 C70 165 10 130 10 85 V35 Z" fill="url(#grad-shield)" stroke="#fef3c7" stroke-width="8"/>
    <!-- Checkmark inside Shield -->
    <path d="M42 85 L62 105 L100 65" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
